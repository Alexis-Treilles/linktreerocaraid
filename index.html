<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Rocaraid – Liens officiels</title>

    <!-- Style simple, léger et mobile-first -->
    <style>
        :root {
            --btn-color: #f2eee9;
            --text-color: #dc2928;
            --bg-color: #ffffff;
        }

        * {
            box-sizing: border-box;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background-color: var(--bg-color);
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--text-color);
        }

        .container {
            width: 100%;
            max-width: 420px;
            padding: 24px;
            text-align: center;
        }

        /* Logo en haut */
        .logo {
            width: 160px;
            margin-bottom: 32px;
        }

        /* Boutons */
        .link {
            display: block;
            width: 100%;
            padding: 16px;
            margin-bottom: 16px;
            background-color: var(--btn-color);
            color: var(--text-color);
            text-decoration: none;
            font-weight: 900;
            border-radius: 12px;
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }

        .link:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 14px rgba(0, 0, 0, 0.12);
        }

        /* Petit footer discret */
        footer {
            margin-top: 32px;
            font-size: 0.85rem;
            opacity: 0.6;
        }
    </style>
</head>

<body>
    <div class="container">

        <!-- Logo -->
        <img src="rocaraid.svg" alt="Logo Rocaraid" class="logo">

        <!-- Liens -->
        <a class="link" href="https://rocaraid.fr" target="_blank">Boutique</a>
        <a class="link" href="https://www.helloasso.com/associations/rocaraid" target="_blank">Notre cagnotte</a>
        <a class="link" href="https://www.instagram.com/rocaraid/" target="_blank">Instagram</a>
        <a class="link" href="https://www.facebook.com/Rocaraid/" target="_blank">Facebook</a>
        <a class="link" href="https://www.tiktok.com/@rocaraid" target="_blank">TikTok</a>

        <footer>
            © Rocaraid
        </footer>

    </div>
</body>
</html>
